<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">
  <rect width="2048" height="2048" fill="#ffffff" />
  
  <!-- Centered Logo Group: scaled 2.65x, centered around (1024, 1024) -->
  <g transform="translate(1024, 1024) scale(2.65) translate(-250, -220)">
    
    <!-- Outer Blue Crescent Arch -->
    <path d="M 125 240 C 85 190 90 100 155 55 C 220 15 275 40 295 65 C 275 50 215 30 160 70 C 110 105 107 185 140 240 C 135 240 130 240 125 240 Z" 
          fill="#0088cc" />

    <!-- Inner Green Crescent Curve -->
    <path d="M 160 150 C 185 100 235 75 295 88 C 245 85 195 105 173 150 Z" 
          fill="#6ea824" />

    <!-- Sparkle 1 (Large Blue Diamond) -->
    <path d="M 287 60 Q 287 72 297 72 Q 287 72 287 84 Q 287 72 277 72 Q 287 72 287 60 Z" 
          fill="#0088cc" />

    <!-- Sparkle 2 (Small Green Diamond) -->
    <path d="M 265 38 Q 265 45 271 45 Q 265 45 265 52 Q 265 45 259 45 Q 265 45 265 38 Z" 
          fill="#6ea824" />

    <!-- Bar 1: Short Left Bar (Green) -->
    <path d="M 260 250 L 260 220 Q 260 205 277 205 Q 295 205 295 220 L 295 250 Z" 
          fill="#6ea824" />

    <!-- Bar 2: Medium Middle Bar (Green) -->
    <path d="M 310 250 L 310 170 Q 310 152 330 152 Q 350 152 350 170 L 350 250 Z" 
          fill="#6ea824" />

    <!-- Bar 3: Tall Right Bar (Blue) -->
    <path d="M 365 250 L 365 75 Q 365 55 387 55 Q 405 55 405 75 L 405 250 Z" 
          fill="#0088cc" />

    <!-- ==================== LOGO TEXT ==================== -->
    <!-- Line 1: NORTHERN ILLINOIS -->
    <text x="250" y="320" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="34" 
          font-weight="800" 
          fill="#0088cc" 
          letter-spacing="0.5" 
          text-anchor="middle">NORTHERN ILLINOIS</text>

    <!-- Line 2: CLEANING SERVICES-LLC -->
    <text x="250" y="368" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="28" 
          font-weight="800" 
          fill="#6ea824" 
          letter-spacing="1" 
          text-anchor="middle">CLEANING SERVICES-LLC</text>

    <!-- Line 3: Tagline (Commercial • Residential) -->
    <text x="250" y="402" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="16" 
          font-weight="600" 
          fill="#0088cc" 
          letter-spacing="4" 
          text-anchor="middle">COMMERCIAL • RESIDENTIAL</text>
  </g>
</svg>
