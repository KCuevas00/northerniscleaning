    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Decorative Circles -->
  <circle cx="700" cy="100" r="160" fill="rgba(255,255,255,0.04)"/>
  <circle cx="100" cy="500" r="200" fill="rgba(255,255,255,0.03)"/>
  
  <!-- Icon Graphics -->
