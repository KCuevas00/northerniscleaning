<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients & Colors -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096e6" />
      <stop offset="100%" stop-color="#006eb5" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80be2a" />
      <stop offset="100%" stop-color="#60981e" />
    </linearGradient>
  </defs>

  <!-- ==================== LOGO ICON ==================== -->
  <g id="logo-icon" transform="translate(15, 10)">
    
    <!-- Outer Blue Crescent Arch -->
    <path d="M 90 230 C 50 180 55 90 120 45 C 185 5 240 30 260 55 C 240 40 180 20 125 60 C 75 95 72 175 105 230 C 100 230 95 230 90 230 Z" 
          fill="#0088cc" />

    <!-- Inner Green Crescent Curve -->
    <path d="M 125 140 C 150 90 200 65 260 78 C 210 75 160 95 138 140 Z" 
          fill="#6ea824" />

    <!-- Sparkle 1 (Large Blue Diamond) -->
    <path d="M 252 50 Q 252 62 262 62 Q 252 62 252 74 Q 252 62 242 62 Q 252 62 252 50 Z" 
          fill="#0088cc" />

    <!-- Sparkle 2 (Small Green Diamond) -->
    <path d="M 230 28 Q 230 35 236 35 Q 230 35 230 42 Q 230 35 224 35 Q 230 35 230 28 Z" 
          fill="#6ea824" />

    <!-- Three Rising Growth / Building Bars -->
    <!-- Bar 1: Short Left Bar (Green) -->
    <path d="M 225 240 L 225 210 Q 225 195 242 195 Q 260 195 260 210 L 260 240 Z" 
          fill="#6ea824" />

    <!-- Bar 2: Medium Middle Bar (Green) -->
    <path d="M 275 240 L 275 160 Q 275 142 295 142 Q 315 142 315 160 L 315 240 Z" 
          fill="#6ea824" />

    <!-- Bar 3: Tall Right Bar (Blue) -->
    <path d="M 330 240 L 330 65 Q 330 45 352 45 Q 370 45 370 65 L 370 240 Z" 
          fill="#0088cc" />
  </g>

  <!-- ==================== LOGO TEXT ==================== -->
  <!-- Line 1: NORTHERN ILLINOIS -->
  <text x="250" y="310" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="34" 
        font-weight="800" 
        fill="#0088cc" 
        letter-spacing="0.5" 
        text-anchor="middle">NORTHERN ILLINOIS</text>

  <!-- Line 2: CLEANING SERVICES-LLC -->
  <text x="250" y="358" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        fill="#6ea824" 
        letter-spacing="1" 
        text-anchor="middle">CLEANING SERVICES-LLC</text>

  <!-- Line 3: Tagline (Commercial • Residential) -->
  <text x="250" y="392" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="16" 
        font-weight="600" 
        fill="#0088cc" 
        letter-spacing="4" 
        text-anchor="middle">COMMERCIAL • RESIDENTIAL</text>
</svg>

